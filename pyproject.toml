[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant search and browse eBay and Etsy via their official APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marketplace-mcp = "marketplace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
